  <rect x="1330" y="232" width="220" height="245" rx="14" fill="#fff8e8" stroke="#d6a73a" stroke-width="2"/>
  <text x="1350" y="267" class="h" fill="#614a16">Decisões principais</text>
  <circle cx="1352" cy="305" r="4" fill="#d6a73a"/><text x="1366" y="310" class="s" fill="#614a16">API sem estado</text>
  <circle cx="1352" cy="343" r="4" fill="#d6a73a"/><text x="1366" y="348" class="s" fill="#614a16">Persistência isolada</text>
  <circle cx="1352" cy="381" r="4" fill="#d6a73a"/><text x="1366" y="386" class="s" fill="#614a16">Contrato em /api/v1</text>
  <circle cx="1352" cy="419" r="4" fill="#d6a73a"/><text x="1366" y="424" class="s" fill="#614a16">Banco substituível</text>

  <text x="65" y="855" class="s" fill="#71869a">Desafio Final - Bootcamp Arquiteto(a) de Software | Arquivo-fonte editável: docs/arquitetura.drawio</text>
