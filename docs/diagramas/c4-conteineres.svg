    <text x="640" y="634" text-anchor="middle" class="m" fill="#e8fffb">OpenAPI 3.1 + Swagger UI</text>
    <text x="640" y="660" text-anchor="middle" class="s" fill="#fff">/docs e /openapi.json</text>
  </g>

  <g class="box">
    <rect x="890" y="563" width="330" height="128" rx="15" fill="#eef3f7" stroke="#7592a8" stroke-width="3"/>
