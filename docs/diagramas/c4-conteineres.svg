    <text x="1055" y="635" text-anchor="middle" class="m" fill="#425d70">Docker | Health check | Ambiente</text>
    <text x="1055" y="661" text-anchor="middle" class="s" fill="#425d70">GitHub Actions executa os testes</text>
  </g>

  <path d="M320 412 H475" class="line" stroke="#2f6fa3" marker-end="url(#arrowBlue)"/>
  <rect x="352" y="378" width="92" height="44" rx="8" fill="#fff"/>
  <text x="398" y="397" text-anchor="middle" class="label">HTTPS / JSON</text><text x="398" y="414" text-anchor="middle" class="s" fill="#274c66">REST</text>
  <path d="M860 379 H975" class="line" stroke="#b75d1e" marker-end="url(#arrowOrange)"/>
  <text x="918" y="363" text-anchor="middle" class="label" fill="#704018">SQL</text>
  <path d="M620 485 V568" class="line" stroke="#187369" marker-end="url(#arrowGreen)"/>
  <text x="683" y="536" text-anchor="middle" class="label" fill="#175e57">expõe contrato</text>
  <path d="M1000 563 V518 H820 V486" class="line" stroke="#7592a8" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/>
