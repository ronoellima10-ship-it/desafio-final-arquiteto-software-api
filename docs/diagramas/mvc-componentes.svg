  <g class="box"><rect x="1120" y="260" width="185" height="140" rx="14" fill="#e9c46a" stroke="#b88717" stroke-width="3"/><text x="1213" y="302" text-anchor="middle" class="h" fill="#4a3710">Repository</text><text x="1213" y="334" text-anchor="middle" class="m" fill="#4a3710">SQL + mapeamento</text><text x="1213" y="359" text-anchor="middle" class="m" fill="#4a3710">Abstração dos dados</text></g>
