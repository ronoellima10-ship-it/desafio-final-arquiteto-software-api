  <g class="box"><rect x="680" y="260" width="180" height="140" rx="14" fill="#176b87" stroke="#0e4f66" stroke-width="3"/><text x="770" y="302" text-anchor="middle" class="h" fill="#fff">Controller</text><text x="770" y="334" text-anchor="middle" class="m" fill="#fff">Entrada HTTP</text><text x="770" y="359" text-anchor="middle" class="m" fill="#fff">Status + JSON</text></g>
